# Notifications automatiques (voir outils/notifier.mjs).
# - à chaque mise à jour du programme : nouveau spectacle, nouvelles dates, séance complète, place libérée ;
# - toutes les 5 minutes : messages écrits par l'équipe (page admin), rappel « Dans 1 h », surveillance de la synchro ;
# - chaque matin vers 10h (heure de Paris) : rappels « demain », avis du lendemain, dernières dates, récap du lundi.
# Un passage sans rien à faire ne lit presque rien dans Firestore (quelques lectures).
# Nécessite le secret FIREBASE_SERVICE_ACCOUNT (Settings > Secrets and variables > Actions).
name: Notifications automatiques
on:
  push:
    branches: [main]
    paths: [site/shows.js]
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      test:
        description: "Envoyer aussi un message d'essai à tous les abonnés"
        type: boolean
        default: false
      rappel:
        description: "Envoyer à chacun le rappel « Demain… » de sa prochaine séance J'y vais (essai)"
        type: boolean
        default: false
concurrency:
  group: notifs
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  notifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-save --no-package-lock firebase-admin@12
      - run: node outils/notifier.mjs
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          NOTIF_TEST: ${{ inputs.test }}
          NOTIF_RAPPEL: ${{ inputs.rappel }}
