<script type="module">
import {initializeApp,getApps,getApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,signInAnonymously,onAuthStateChanged} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getFirestore,doc,setDoc,deleteDoc,serverTimestamp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
// Envoi anonyme vers Firestore (aucun nom n'est envoyé) :
//  - votes/{uid} : favoris et « J'y vais » (statistiques), seulement si « Mon espace » est créé ;
//  - tokens/{uid} : adresse de notification du téléphone (si les notifications sont activées),
//    avec les favoris et « J'y vais » pour les rappels personnels.
const cfg=window.FIREBASE_CONFIG;
if(cfg&&cfg.apiKey&&!cfg.apiKey.startsWith("A_REMPLACER")){
  try{
    const app=getApps().length?getApp():initializeApp(cfg),auth=getAuth(app),db=getFirestore(app);
    let uid=null,timer=null;
    const push=async()=>{
      if(!uid)return;
      const st=window.chariotState?window.chariotState():null;
      try{ if(st) await setDoc(doc(db,"votes",uid),{favs:st.favs,plans:st.plans,updatedAt:serverTimestamp()}); else await deleteDoc(doc(db,"votes",uid)); }
      catch(e){console.warn("Envoi impossible",e)}
      const tk=window.chariotToken;
      if(tk){
        try{ await setDoc(doc(db,"tokens",uid),{token:tk,favs:st?st.favs:[],plans:st?st.plans:[],updatedAt:serverTimestamp()}); }
        catch(e){console.warn("Abonnement aux notifications non enregistré",e)}
      }
    };
    window.chariotSync=()=>{clearTimeout(timer);timer=setTimeout(push,800)};
    onAuthStateChanged(auth,u=>{if(u){uid=u.uid;push()}});
    signInAnonymously(auth).catch(e=>console.warn("Connexion anonyme impossible",e));
  }catch(e){console.warn(e)}
}
</script>
