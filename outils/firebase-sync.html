<script type="module">
import {initializeApp,getApps,getApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,signInAnonymously,onAuthStateChanged} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getFirestore,doc,getDoc,setDoc,deleteDoc,addDoc,collection,serverTimestamp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
// Envoi anonyme vers Firestore (aucun nom n'est envoyé) :
//  - votes/{uid} : favoris et « J'y vais » (statistiques), seulement si « Mon espace » est créé ;
//  - tokens/{uid} : adresse de notification du téléphone (si les notifications sont activées),
//    avec les favoris et « J'y vais » pour les rappels personnels.
const cfg=window.FIREBASE_CONFIG;
if(cfg&&cfg.apiKey&&!cfg.apiKey.startsWith("A_REMPLACER")){
  try{
    const app=getApps().length?getApp():initializeApp(cfg),auth=getAuth(app),db=getFirestore(app);
    let uid=null,timer=null;
    const push=async()=>{
      if(!uid)return;
      const st=window.chariotState?window.chariotState():null;
      // Si les règles Firestore n'acceptent pas encore les avis/alertes, on renvoie sans ces champs.
      const put=async(name,full,base)=>{try{await setDoc(doc(db,name,uid),full)}catch(e){if(e&&e.code==="permission-denied"){await setDoc(doc(db,name,uid),base)}else throw e}};
      try{ if(st) await put("votes",{favs:st.favs,plans:st.plans,ratings:st.ratings||{},updatedAt:serverTimestamp()},{favs:st.favs,plans:st.plans,updatedAt:serverTimestamp()}); else await deleteDoc(doc(db,"votes",uid)); }
      catch(e){console.warn("Envoi impossible",e)}
      const tk=window.chariotToken;
      if(tk){
        const L=window.chariotLog||(()=>{});
        try{ const b={token:tk,favs:st?st.favs:[],plans:st?st.plans:[],updatedAt:serverTimestamp()}; await put("tokens",{...b,alerts:st&&st.alerts?st.alerts:[],rem:st&&st.rem?st.rem:{veille:true,jourj:true,avis:true}},b); L("Abonnement enregistré dans Firestore"); }
        catch(e){console.warn("Abonnement aux notifications non enregistré",e);L("Erreur Firestore : "+(e.code||"")+" "+e.message)}
      }
    };
    window.chariotSync=()=>{clearTimeout(timer);timer=setTimeout(push,800)};
    // Séances complètes cochées par l'équipe sur la page admin (config/complets) :
    // { full: { "idSpectacle|MM-JJ HH:MM": true (complet) ou false (places de nouveau en vente) } }
    const CK="chariot-complets";
    const base={};try{SHOWS.forEach(x=>base[x.id]=(x.full||[]).slice())}catch(e){}
    const applyFull=m=>{try{let ch=false;SHOWS.forEach(x=>{if(!x.sessions)return;const f=new Set(base[x.id]||[]);
        x.sessions.forEach(k=>{const v=m[x.id+"|"+k];if(v===true)f.add(k);else if(v===false)f.delete(k)});
        const nf=x.sessions.filter(k=>f.has(k));if(JSON.stringify(nf)!==JSON.stringify(x.full||[])){x.full=nf;ch=true}});
      if(ch&&typeof render==="function")render()}catch(e){console.warn(e)}};
    try{const c=JSON.parse(localStorage.getItem(CK)||"null");if(c)applyFull(c)}catch(e){}
    getDoc(doc(db,"config","complets")).then(d=>{const m=(d.exists()&&d.data().full)||{};try{localStorage.setItem(CK,JSON.stringify(m))}catch(e){}applyFull(m)}).catch(e=>console.warn("Séances complètes non lues",e));
    // Ouverture depuis une notification (?n=type) : compteur anonyme pour les statistiques
    const logOpen=async()=>{try{const q=new URLSearchParams(location.search),n=q.get("n");if(!n)return;const k="chariot-n-"+location.search;if(sessionStorage.getItem(k))return;sessionStorage.setItem(k,"1");
      await addDoc(collection(db,"ouvertures"),{n:n.slice(0,60),at:serverTimestamp()});q.delete("n");history.replaceState(null,"",location.pathname+(q.toString()?"?"+q:"")+location.hash)}catch(e){console.warn("Ouverture non comptée",e)}};
    onAuthStateChanged(auth,u=>{if(u){uid=u.uid;(window.chariotLog||(()=>{}))("Connexion anonyme OK");push();logOpen()}});
    signInAnonymously(auth).catch(e=>{console.warn("Connexion anonyme impossible",e);(window.chariotLog||(()=>{}))("Erreur connexion : "+(e.code||"")+" "+e.message)});
  }catch(e){console.warn(e)}
}
</script>
