<!-- Notifications de l'équipe (ajouté par outils/build.py) -->
<style>
.notif-bar{max-width:560px;margin:12px auto 0;padding-inline:16px}
.notif-bar .card{display:grid;gap:10px;border-left:6px solid var(--accent)}
.notif-bar .row{display:flex;gap:8px;flex-wrap:wrap}
.notif-bar .row .btn{flex:1}
</style>
<div class="notif-bar" id="notif-bar" hidden>
  <div class="card">
    <b style="font-family:var(--display)">Recevoir les nouvelles du Chariot ?</b>
    <span class="small">Nouveaux spectacles, dernières places, changements de programme. Vous pourrez les couper à tout moment dans les réglages du téléphone.</span>
    <div class="row"><button class="btn" id="notif-yes" type="button">Activer les notifications</button><button class="btn ghost" id="notif-no" type="button">Non merci</button></div>
  </div>
</div>
<script type="module">
import {initializeApp,getApps,getApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getMessaging,getToken,onMessage,isSupported} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-messaging.js";

const $=id=>document.getElementById(id);
const cfg=self.FIREBASE_CONFIG, vapid=self.FIREBASE_VAPID_KEY;
const KEY="chariot-notifs";
const get=()=>{try{return localStorage.getItem(KEY)}catch(e){return null}};
const set=v=>{try{localStorage.setItem(KEY,v)}catch(e){}};
const ua=navigator.userAgent;
const ios=/iphone|ipad|ipod/i.test(ua)||(/macintosh/i.test(ua)&&navigator.maxTouchPoints>1);
const standalone=matchMedia("(display-mode: standalone)").matches||navigator.standalone===true;
const say=t=>{try{toast(t)}catch(e){}};

async function main(){
  if(!cfg||!cfg.apiKey||cfg.apiKey.startsWith("A_REMPLACER")||!vapid||vapid.startsWith("A_REMPLACER"))return;
  if(!("Notification" in window)||!("serviceWorker" in navigator))return;
  if(!(await isSupported().catch(()=>false)))return;
  if(ios&&!standalone)return; // sur iPhone, les notifications ne marchent qu'avec l'appli installée

  const app=getApps().length?getApp():initializeApp(cfg);
  const messaging=getMessaging(app);

  async function subscribe(){
    const reg=await navigator.serviceWorker.register("sw.js");
    await navigator.serviceWorker.ready;
    return getToken(messaging,{vapidKey:vapid,serviceWorkerRegistration:reg});
  }

  // Message reçu pendant que l'appli est ouverte : on l'affiche quand même.
  onMessage(messaging,async p=>{
    const n=p.notification||{};
    try{const reg=await navigator.serviceWorker.ready;reg.showNotification(n.title||"Théâtre du Chariot",{body:n.body||"",icon:"icon-192.png",data:{FCM_MSG:{notification:{click_action:"./"}}}})}
    catch(e){say(n.title||"Nouveau message du Chariot")}
  });

  if(Notification.permission==="granted"){subscribe().catch(()=>{});return}
  if(Notification.permission==="denied"||get())return;

  // Proposition affichée après les fenêtres d'accueil et d'installation.
  const later=()=>new Promise(r=>{
    const busy=()=>["welcome","install"].some(id=>{const el=$(id);return el&&!el.hidden});
    const tick=()=>busy()?setTimeout(tick,800):r();
    setTimeout(tick,2500);
  });
  await later();
  $("notif-bar").hidden=false;

  $("notif-no").addEventListener("click",()=>{set("non");$("notif-bar").hidden=true});
  $("notif-yes").addEventListener("click",async()=>{
    const p=await Notification.requestPermission().catch(()=>"denied");
    $("notif-bar").hidden=true;
    if(p!=="granted"){set("non");say("Notifications non activées");return}
    try{await subscribe();set("oui");say("Notifications activées")}
    catch(e){console.warn(e);say("Activation impossible pour le moment")}
  });
}
main();
</script>
